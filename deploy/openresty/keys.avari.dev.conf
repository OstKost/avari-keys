# ==============================================================================
# OpenResty / Nginx Configuration for Avari Keys Master (keys.avari.dev)
# ==============================================================================
# Location on server: /usr/local/openresty/nginx/conf/conf.d/keys.avari.dev.conf
#                 or: /etc/nginx/conf.d/keys.avari.dev.conf
#                 or: via OpenResty Manager / Nginx Proxy Manager Web UI
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name keys.avari.dev;

    # Redirect all HTTP traffic to HTTPS (Managed automatically by OpenResty Manager / Certbot)
    # return 301 https://$host$request_uri;

    # ==========================================================================
    # 1. Frontend SPA (React / Vite)
    # ==========================================================================
    root /var/www/avari-keys/frontend;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ==========================================================================
    # 2. Master Backend API Reverse Proxy (:8080)
    # ==========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket / Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ==========================================================================
    # 3. Security & Upload Limits
    # ==========================================================================
    client_max_body_size 16M;
}
