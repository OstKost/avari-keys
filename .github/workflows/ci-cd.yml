name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: 'Компонент для деплоя на продакшене'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'all-slaves'
          - 'slave-api'
          - 'master-api'
          - 'frontend-only'
      target_host:
        description: 'IP/Хост целевого VPS (для одиночного slave-api или master-api)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # ==========================================
  # 1. Сборка, линтинг и тестирование
  # ==========================================
  test-and-build:
    name: 🧪 Test & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: Check private deployment inventory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SLAVE_HOSTS: ${{ secrets.SLAVE_HOSTS }}
          CASCADE_GATEWAY_HOST: ${{ secrets.CASCADE_GATEWAY_HOST }}
          TELEGRAM_PROXY_SERVER: ${{ secrets.TELEGRAM_PROXY_SERVER }}
          NETWORK_PROBE_TARGETS: ${{ secrets.NETWORK_PROBE_TARGETS }}
          CASCADE_EGRESS_CONFIG: ${{ secrets.CASCADE_EGRESS_CONFIG }}
        run: python3 scripts/check_private_inventory.py

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: apps/backend/go.sum

      - name: 📦 Go Vet & Tests
        working-directory: apps/backend
        run: |
          go vet ./...
          go test -v -race ./...

      - name: 🏗️ Compile Static Linux (amd64) Binaries
        working-directory: apps/backend
        run: |
          mkdir -p ../../dist/linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/linux-amd64/avari-master ./cmd/master
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/linux-amd64/avari-slave ./cmd/slave
          chmod +x ../../dist/linux-amd64/avari-master ../../dist/linux-amd64/avari-slave

      - name: ⚡ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies & Build SPA
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avari-build-artifacts
          retention-days: 1
          path: |
            dist/linux-amd64/avari-master
            dist/linux-amd64/avari-slave
            apps/frontend/dist/
            scripts/avari-egress.py
            scripts/install_egress.sh
            deploy/systemd/avari-master.service
            deploy/systemd/avari-slave.service
            deploy/systemd/avari-vless.service

  # ==========================================
  # 2. Деплой Frontend SPA (Автоматически на push в main/master или по запросу)
  # ==========================================
  deploy-frontend:
    name: 🌐 Deploy Frontend (Web SPA)
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend-only'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-frontend-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📦 Sync Frontend Static Files (Atomic Swap)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          : "${SSH_HOST:?SSH_HOST secret is required}"
          DEPLOY_TMP="/tmp/avari-front-${RUN_ID}"
          SSH_CMD="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${SSH_HOST}"
          RSYNC_CMD="rsync -avz --delete -e \"ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new\""

          echo "==> Creating temporary frontend staging folder..."
          $SSH_CMD "mkdir -p ${DEPLOY_TMP} /var/www/avari-keys/frontend"

          echo "==> Uploading Frontend build to staging..."
          eval $RSYNC_CMD deploy-artifacts/apps/frontend/dist/ ${SSH_USER}@${SSH_HOST}:${DEPLOY_TMP}/

          echo "==> Applying frontend update..."
          $SSH_CMD "rsync -av --delete ${DEPLOY_TMP}/ /var/www/avari-keys/frontend/ && rm -rf ${DEPLOY_TMP} && (/usr/bin/openresty -p /opt/om/nginx/ -s reload 2>/dev/null || systemctl reload openresty 2>/dev/null || systemctl reload nginx 2>/dev/null || systemctl reload caddy 2>/dev/null || true)"
          echo "✅ Frontend successfully updated!"

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # ==========================================
  # 3. Деплой Master Backend API (Автоматически на push в main/master или по запросу)
  # ==========================================
  deploy-master:
    name: 👑 Deploy Master API (Backend)
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'master-api'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-master-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ github.event.inputs.target_host || secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Deploy avari-master Binary & Restart
        env:
          TARGET_HOST: ${{ github.event.inputs.target_host || secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
          NETWORK_PROBE_TARGETS: ${{ secrets.NETWORK_PROBE_TARGETS }}
          TELEGRAM_PROXY_SERVER: ${{ secrets.TELEGRAM_PROXY_SERVER }}
          TELEGRAM_PROXY_SECRET: ${{ secrets.TELEGRAM_PROXY_SECRET }}
          TELEGRAM_PROXY_PORT: ${{ secrets.TELEGRAM_PROXY_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NETWORK_PROBE_INTERFACE: ${{ secrets.MASTER_PUBLIC_INTERFACE }}
        run: |
          DEPLOY_TMP="/tmp/avari-master-${RUN_ID}"
          SSH_CMD="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${TARGET_HOST}"
          SCP_CMD="scp -i ~/.ssh/id_deploy -P ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          echo "==> Deploying avari-master to ${TARGET_HOST}..."
          $SSH_CMD "mkdir -p ${DEPLOY_TMP} /usr/local/bin /opt/avari-keys/data"
          $SCP_CMD deploy-artifacts/dist/linux-amd64/avari-master ${SSH_USER}@${TARGET_HOST}:${DEPLOY_TMP}/avari-master
          $SCP_CMD deploy-artifacts/deploy/systemd/avari-master.service ${SSH_USER}@${TARGET_HOST}:${DEPLOY_TMP}/avari-master.service
          $SSH_CMD "install -m 755 ${DEPLOY_TMP}/avari-master /usr/local/bin/avari-master && install -m 644 ${DEPLOY_TMP}/avari-master.service /etc/systemd/system/avari-master.service && rm -rf ${DEPLOY_TMP}"

          # Keep addresses outside the checkout and build artifacts.
          python3 -c '
          import os
          print("[Service]")
          for key in ("NETWORK_PROBE_TARGETS", "TELEGRAM_PROXY_SERVER", "TELEGRAM_PROXY_SECRET", "TELEGRAM_PROXY_PORT", "JWT_SECRET", "NETWORK_PROBE_INTERFACE"):
              value = os.environ.get(key, "")
              if not value:
                  raise SystemExit("Missing runtime secret: " + key)
              if "\n" in value or "\r" in value:
                  raise SystemExit("Invalid multiline runtime secret: " + key)
              print("Environment=\"" + key + "=" + value.replace("\\", "\\\\").replace("\"", "\\\"").replace("%", "%%") + "\"")
          ' | $SSH_CMD 'umask 077; mkdir -p /etc/systemd/system/avari-master.service.d; cat > /etc/systemd/system/avari-master.service.d/runtime.conf'
          echo "==> Restarting avari-master service..."
          $SSH_CMD "systemctl daemon-reload && systemctl restart avari-master"
          sleep 2
          $SSH_CMD "systemctl is-active avari-master"
          echo "✅ avari-master is active and running!"

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # ==========================================
  # 4. Подготовка списка Slave-нод (парсинг секрета)
  # ==========================================
  prepare-slaves:
    name: 📋 Prepare Slave Hosts
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'all-slaves' || github.event.inputs.target == 'slave-api'))
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.parse.outputs.hosts }}
    steps:
      - name: Parse host list
        id: parse
        env:
          SLAVE_HOSTS: ${{ secrets.SLAVE_HOSTS }}
          SINGLE_TARGET_HOST: ${{ github.event.inputs.target_host }}
          TARGET_MODE: ${{ github.event.inputs.target }}
        run: |
          if [ "${TARGET_MODE}" = "slave-api" ] && [ -n "${SINGLE_TARGET_HOST}" ]; then
            HOSTS="${SINGLE_TARGET_HOST}"
          else
            HOSTS="${SLAVE_HOSTS}"
          fi
          JSON=$(printf '%s\n' ${HOSTS} | grep -v '^$' | jq -R . | jq -s -c .)
          if [ "$JSON" = "[]" ]; then JSON='["__none__"]'; fi
          echo "hosts=${JSON}" >> "$GITHUB_OUTPUT"
          echo "Parsed hosts: ${JSON}"

  # ==========================================
  # 5. Деплой каждой Slave-ноды (независимый, неблокирующий)
  # ==========================================
  deploy-slave:
    name: ⚡ Deploy Slave (${{ matrix.host }})
    needs: prepare-slaves
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'all-slaves' || github.event.inputs.target == 'slave-api'))
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.prepare-slaves.outputs.hosts) }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-slave-deploy-${{ matrix.host }}
      cancel-in-progress: false
    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: 🚀 Deploy & Restart
        env:
          TARGET: ${{ matrix.host }}
          SSH_JUMP_HOST: ${{ secrets.SSH_JUMP_HOST }}
          CASCADE_GATEWAY_HOST: ${{ secrets.CASCADE_GATEWAY_HOST }}
          NETWORK_PROBE_INTERFACE: ${{ secrets.CASCADE_PUBLIC_INTERFACE }}
          CASCADE_EGRESS_CONFIG: ${{ secrets.CASCADE_EGRESS_CONFIG }}
          NETWORK_PROBE_TARGETS: ${{ secrets.NETWORK_PROBE_TARGETS }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${TARGET}" = "__none__" ]; then
            echo "No slave hosts configured; skipping."
            exit 0
          fi
          echo "::add-mask::${TARGET}"
          DEPLOY_TMP="/tmp/avari-slave-${RUN_ID}"
          SSH_BASE_OPTS="-i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes"
          SCP_BASE_OPTS="-O -i ~/.ssh/id_deploy -P ${SSH_PORT} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          printf '%s\n' \
            'Host *' \
            '  IdentityFile ~/.ssh/id_deploy' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking accept-new' \
            '  TCPKeepAlive yes' \
            '  ServerAliveInterval 10' \
            '  ServerAliveCountMax 3' \
            '  ConnectTimeout 30' \
            '  ControlMaster auto' \
            '  ControlPath /tmp/ssh-%C' \
            '  ControlPersist 120s' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          [ -z "$SSH_JUMP_HOST" ] || echo "::add-mask::${SSH_JUMP_HOST}"

          deploy_slave_node() {
            local TARGET="$1"
            local SSH_OPTS="$SSH_BASE_OPTS"
            local SCP_OPTS="$SCP_BASE_OPTS"
            if [ -n "$SSH_JUMP_HOST" ] && [ "$TARGET" != "$SSH_JUMP_HOST" ]; then
              SSH_OPTS="$SSH_OPTS -J ${SSH_USER}@${SSH_JUMP_HOST}:${SSH_PORT}"
              SCP_OPTS="$SCP_OPTS -J ${SSH_USER}@${SSH_JUMP_HOST}:${SSH_PORT}"
            fi

            ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} "mkdir -p ${DEPLOY_TMP} /usr/local/bin /opt/avari-keys/data" || return 1
            scp ${SCP_OPTS} deploy-artifacts/dist/linux-amd64/avari-slave ${SSH_USER}@${TARGET}:${DEPLOY_TMP}/avari-slave || return 1
            ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} "install -m 755 ${DEPLOY_TMP}/avari-slave /usr/local/bin/avari-slave" || return 1
            if [ "$TARGET" = "$CASCADE_GATEWAY_HOST" ]; then
              ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} "if systemctl list-unit-files avari-slave-premium.service 2>/dev/null | grep -q avari-slave-premium.service; then install -m 755 ${DEPLOY_TMP}/avari-slave /usr/local/bin/avari-slave-premium; fi" || return 1
            fi

            scp ${SCP_OPTS} deploy-artifacts/deploy/systemd/avari-slave.service ${SSH_USER}@${TARGET}:${DEPLOY_TMP}/avari-slave.service || return 1
            ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} "[ -f /etc/systemd/system/avari-slave.service ] || install -m 644 ${DEPLOY_TMP}/avari-slave.service /etc/systemd/system/avari-slave.service" || return 1

            if [ "$TARGET" = "$CASCADE_GATEWAY_HOST" ]; then
              echo "==> Configuring egress routing for cascade gateway..."
              : "${NETWORK_PROBE_TARGETS:?Missing probe targets secret}"
              : "${CASCADE_EGRESS_CONFIG:?Missing cascade registry secret}"
              printf '%s' "$CASCADE_EGRESS_CONFIG" | ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} 'umask 077; mkdir -p /etc/avari-keys; cat > /etc/avari-keys/egress.json' || return 1
              python3 -c '
              import os
              print("[Service]")
              iface = os.environ.get("NETWORK_PROBE_INTERFACE", "").strip()
              if not iface or not iface.replace("_","").replace("-","").replace(".","").isalnum():
                  raise SystemExit("Invalid public network interface")
              print("Environment=\"NETWORK_PROBE_INTERFACE=" + iface + "\"")
              value = os.environ.get("NETWORK_PROBE_TARGETS", "")
              if "\n" in value or "\r" in value:
                  raise SystemExit("Probe inventory must be single-line JSON")
              print("Environment=\"NETWORK_PROBE_TARGETS=" + value.replace("\\", "\\\\").replace("\"", "\\\"").replace("%", "%%") + "\"")
              ' | ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} 'umask 077; mkdir -p /etc/systemd/system/avari-slave.service.d; cat > /etc/systemd/system/avari-slave.service.d/network.conf' || return 1
              scp ${SCP_OPTS} deploy-artifacts/scripts/avari-egress.py deploy-artifacts/scripts/install_egress.sh ${SSH_USER}@${TARGET}:${DEPLOY_TMP}/ || return 1
              ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} "if [ -f /root/awg/awg-routing.sh ]; then bash ${DEPLOY_TMP}/install_egress.sh >/dev/null; else echo 'WARN: AmneziaWG not provisioned, skipping egress routing install'; fi" || return 1
            fi

            ssh ${SSH_OPTS} ${SSH_USER}@${TARGET} "rm -rf ${DEPLOY_TMP} && systemctl daemon-reload && (systemctl is-active --quiet avari-slave && systemctl restart avari-slave || systemctl enable --now avari-slave) && systemctl is-active --quiet avari-slave && (if systemctl list-unit-files avari-slave-premium.service 2>/dev/null | grep -q avari-slave-premium.service; then (systemctl is-active --quiet avari-slave-premium && systemctl restart avari-slave-premium || systemctl enable --now avari-slave-premium) && systemctl is-active --quiet avari-slave-premium; fi) && echo 'Slave deployed and active'" || return 1
            return 0
          }

          echo "==> [Node: ${TARGET}] Connecting & Deploying avari-slave..."
          DEPLOYED=0
          MAX_ATTEMPTS=3
          for ATTEMPT in $(seq 1 ${MAX_ATTEMPTS}); do
            if [ ${ATTEMPT} -gt 1 ]; then
              echo "⏳ Retrying [Node: ${TARGET}] in 10s (Attempt ${ATTEMPT}/${MAX_ATTEMPTS})..."
              sleep 10
            fi
            if deploy_slave_node "${TARGET}"; then
              DEPLOYED=1
              break
            else
              echo "⚠️ Attempt ${ATTEMPT}/${MAX_ATTEMPTS} for [Node: ${TARGET}] failed."
            fi
          done

          if [ ${DEPLOYED} -ne 1 ]; then
            echo "❌ Node ${TARGET} unreachable after ${MAX_ATTEMPTS} attempts — deployment failed (non-blocking)"
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=⚠️ CI/CD: не удалось обновить ноду ${TARGET} (${MAX_ATTEMPTS} попыток)" >/dev/null || true
            fi
            # Ошибка одной ноды не останавливает пайплайн.
          else
            echo "✅ Node ${TARGET} deployed and active"
          fi

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # ==========================================
  # 5. Публикация GitHub Release с бинарниками (на тег v*)
  # ==========================================
  release:
    name: 📦 Publish GitHub Release Assets
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: apps/backend/go.sum

      - name: 🏗️ Build static binaries (amd64 + arm64)
        working-directory: apps/backend
        run: |
          mkdir -p ../../dist/release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/release/avari-master-amd64 ./cmd/master
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/release/avari-slave-amd64 ./cmd/slave
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../dist/release/avari-master-arm64 ./cmd/master
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../dist/release/avari-slave-arm64 ./cmd/slave

      - name: 📤 Publish release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/avari-master-amd64
            dist/release/avari-slave-amd64
            dist/release/avari-master-arm64
            dist/release/avari-slave-arm64
          generate_release_notes: true
