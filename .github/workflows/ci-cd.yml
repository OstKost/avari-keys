name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: 'Компонент для деплоя на продакшене'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'all-slaves'
          - 'slave-api'
          - 'master-api'
          - 'frontend-only'
      target_host:
        description: 'IP/Хост целевого VPS (для одиночного slave-api или master-api)'
        required: false
        default: '176.53.174.118'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # ==========================================
  # 1. Сборка, линтинг и тестирование
  # ==========================================
  test-and-build:
    name: 🧪 Test & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: apps/backend/go.sum

      - name: 📦 Go Vet & Tests
        working-directory: apps/backend
        run: |
          go vet ./...
          go test -v -race ./...

      - name: 🏗️ Compile Static Linux (amd64) Binaries
        working-directory: apps/backend
        run: |
          mkdir -p ../../dist/linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/linux-amd64/avari-master ./cmd/master
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/linux-amd64/avari-slave ./cmd/slave
          chmod +x ../../dist/linux-amd64/avari-master ../../dist/linux-amd64/avari-slave

      - name: ⚡ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies & Build SPA
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avari-build-artifacts
          retention-days: 1
          path: |
            dist/linux-amd64/avari-master
            dist/linux-amd64/avari-slave
            apps/frontend/dist/

  # ==========================================
  # 2. Деплой Frontend SPA (Автоматически на push в main/master или по запросу)
  # ==========================================
  deploy-frontend:
    name: 🌐 Deploy Frontend (Web SPA)
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend-only'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-frontend-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '176.53.174.118' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📦 Sync Frontend Static Files (Atomic Swap)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '176.53.174.118' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DEPLOY_TMP="/tmp/avari-front-${RUN_ID}"
          SSH_CMD="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${SSH_HOST}"
          RSYNC_CMD="rsync -avz --delete -e \"ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new\""

          echo "==> Creating temporary frontend staging folder..."
          $SSH_CMD "mkdir -p ${DEPLOY_TMP} /var/www/avari-keys/frontend"

          echo "==> Uploading Frontend build to staging..."
          eval $RSYNC_CMD deploy-artifacts/apps/frontend/dist/ ${SSH_USER}@${SSH_HOST}:${DEPLOY_TMP}/

          echo "==> Applying frontend update..."
          $SSH_CMD "rsync -av --delete ${DEPLOY_TMP}/ /var/www/avari-keys/frontend/ && rm -rf ${DEPLOY_TMP} && (/usr/bin/openresty -p /opt/om/nginx/ -s reload 2>/dev/null || systemctl reload openresty 2>/dev/null || systemctl reload nginx 2>/dev/null || systemctl reload caddy 2>/dev/null || true)"
          echo "✅ Frontend successfully updated!"

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # ==========================================
  # 3. Деплой Master Backend API (Автоматически на push в main/master или по запросу)
  # ==========================================
  deploy-master:
    name: 👑 Deploy Master API (Backend)
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'master-api'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-master-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ github.event.inputs.target_host || secrets.SSH_HOST || '176.53.174.118' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Deploy avari-master Binary & Restart
        env:
          TARGET_HOST: ${{ github.event.inputs.target_host || secrets.SSH_HOST || '176.53.174.118' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DEPLOY_TMP="/tmp/avari-master-${RUN_ID}"
          SSH_CMD="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${TARGET_HOST}"
          SCP_CMD="scp -i ~/.ssh/id_deploy -P ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          echo "==> Deploying avari-master to ${TARGET_HOST}..."
          $SSH_CMD "mkdir -p ${DEPLOY_TMP} /usr/local/bin /opt/avari-keys/data"
          $SCP_CMD deploy-artifacts/dist/linux-amd64/avari-master ${SSH_USER}@${TARGET_HOST}:${DEPLOY_TMP}/avari-master
          $SSH_CMD "install -m 755 ${DEPLOY_TMP}/avari-master /usr/local/bin/avari-master && rm -rf ${DEPLOY_TMP}"

          echo "==> Restarting avari-master service..."
          $SSH_CMD "systemctl daemon-reload && systemctl restart avari-master"
          sleep 2
          $SSH_CMD "systemctl is-active avari-master"
          echo "✅ avari-master is active and running!"

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # ==========================================
  # 4. Автоматический деплой на ВСЕ Slave сервера
  # ==========================================
  deploy-slaves:
    name: ⚡ Deploy All Slave Nodes (Automated)
    needs: test-and-build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'all-slaves' || github.event.inputs.target == 'slave-api'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-slaves-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: avari-build-artifacts
          path: deploy-artifacts

      - name: 🔑 Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: Secret SSH_PRIVATE_KEY is not defined in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: 🚀 Deploy avari-slave to All Nodes & Restart
        env:
          SLAVE_HOSTS: ${{ secrets.SLAVE_HOSTS || '176.53.174.118 185.213.240.136 157.228.142.20 157.228.130.7' }}
          SINGLE_TARGET_HOST: ${{ github.event.inputs.target_host }}
          TARGET_MODE: ${{ github.event.inputs.target }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DEPLOY_TMP="/tmp/avari-slave-${RUN_ID}"

          # Determine which hosts to deploy to
          if [ "${TARGET_MODE}" = "slave-api" ] && [ -n "${SINGLE_TARGET_HOST}" ]; then
            HOSTS_TO_DEPLOY="${SINGLE_TARGET_HOST}"
          else
            HOSTS_TO_DEPLOY="${SLAVE_HOSTS}"
          fi

          echo "==> Target Slave Nodes to deploy: ${HOSTS_TO_DEPLOY}"

          for HOST in ${HOSTS_TO_DEPLOY}; do
            echo ""
            echo "=================================================="
            echo "==> [Node: ${HOST}] Connecting & Deploying avari-slave..."
            echo "=================================================="
            ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

            ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 ${SSH_USER}@${HOST} "mkdir -p ${DEPLOY_TMP} /usr/local/bin /opt/avari-keys/data" || {
              echo "⚠️ Warning: Failed to connect to ${HOST}, skipping..."
              continue
            }

            scp -i ~/.ssh/id_deploy -P ${SSH_PORT} -o StrictHostKeyChecking=accept-new deploy-artifacts/dist/linux-amd64/avari-slave ${SSH_USER}@${HOST}:${DEPLOY_TMP}/avari-slave
            
            ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${SSH_USER}@${HOST} "install -m 755 ${DEPLOY_TMP}/avari-slave /usr/local/bin/avari-slave && rm -rf ${DEPLOY_TMP} && systemctl daemon-reload && (systemctl is-active --quiet avari-slave && systemctl restart avari-slave && echo '✅ avari-slave restarted successfully on ${HOST}!' || echo 'ℹ️ avari-slave is not active on ${HOST}')"
          done

          echo ""
          echo "🎉 All designated Slave nodes have been processed!"

      - name: 🧹 Cleanup SSH Credentials
        if: always()
        run: rm -rf ~/.ssh/id_deploy
